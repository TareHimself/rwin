# https://taskfile.dev

version: '3'

tasks:
    build:
      cmds:
        - cmd: conan create . --build=missing -s build_type=Release -s compiler.cppstd=20 {{.CLI_ARGS}}
          platforms: [windows,darwin]
        - cmd: uv run conan create . --build=missing -s build_type=Release -pr:h=profiles/linux-wayland -pr:b=profiles/linux-wayland {{.CLI_ARGS}}
          platforms: [linux]
    build-debug:
      cmds:
        - cmd: conan create . --build=missing -s build_type=Debug  -s compiler.cppstd=20 {{.CLI_ARGS}}
          platforms: [windows,darwin]
        - cmd: uv run conan create . --build=missing -s build_type=Debug  -pr:h=profiles/linux-wayland -pr:b=profiles/linux-wayland {{.CLI_ARGS}}
          platforms: [linux]
    setup:
      cmds:
        - cmd: conan install . --build=missing -s build_type=Release  -s compiler.cppstd=20 {{.CLI_ARGS}}
          platforms: [windows,darwin]
        - cmd: uv run conan install . --build=missing -s build_type=Release  -pr:h=profiles/linux-wayland -pr:b=profiles/linux-wayland {{.CLI_ARGS}}
          platforms: [linux]
    setup-debug:
      cmds:
        - cmd: conan install . --build=missing -s build_type=Debug  -s compiler.cppstd=20 {{.CLI_ARGS}}
          platforms: [windows,darwin]
        - cmd: uv run conan install . --build=missing -s build_type=Debug  -pr:h=profiles/linux-wayland -pr:b=profiles/linux-wayland {{.CLI_ARGS}}
          platforms: [linux]
